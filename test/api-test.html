<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>API 測試台 · Language Tutor in YouTube</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --dim:#666; --line:#ddd; --card:#fafafa; --accent:#7c5cff; --ok:#2a9d5c; --err:#d64545; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#f1f1f1; --dim:#999; --line:#333; --card:#1d1d1d; } }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--fg); font-family:"Noto Sans TC",system-ui,sans-serif;
         margin:0; padding:32px 20px 80px; line-height:1.6; }
  main { max-width:820px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  .warn { background:rgba(124,92,255,.08); border:1px solid var(--accent); border-radius:8px;
          padding:10px 14px; font-size:13px; margin-bottom:24px; }
  label { display:block; font-weight:600; font-size:13px; margin-bottom:4px; }
  .row { margin-bottom:16px; }
  .two { display:flex; gap:12px; } .two > div { flex:1; }
  input, select, textarea { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
         background:var(--card); color:var(--fg); font-size:14px; font-family:inherit; }
  textarea { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; min-height:110px; resize:vertical; }
  button { border:1px solid var(--line); background:var(--card); color:var(--fg);
           border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; font-family:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { display:flex; gap:8px; align-items:center; margin:20px 0; }
  .hint { color:var(--dim); font-size:12px; margin-top:4px; }
  .step { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--card); }
  .step h3 { margin:0 0 6px; font-size:13px; display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.ok { background:var(--ok); } .dot.err { background:var(--err); }
  .dot.run { background:var(--accent); animation:p 1s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  pre { margin:0; white-space:pre-wrap; word-break:break-all; font-family:ui-monospace,Menlo,monospace;
        font-size:12px; color:var(--dim); max-height:320px; overflow:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:6px; }
  .word { font-size:15px; font-weight:700; } .pos { color:var(--dim); font-style:italic; font-size:12px; margin-left:6px; }
  .zh { color:var(--dim); font-size:13px; }
  h2 { font-size:15px; margin:22px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>API 測試台</h1>
  <div class="sub">用擴充實際會跑的那份程式碼（<code>background/providers.js</code>）打一次真實請求。</div>

  <div class="warn">
    🔒 API key 只留在這個分頁裡：不會存檔、不會寫進 localStorage、不會送去 API 以外的任何地方。
    這個頁面是你電腦上的本機檔案。測完關掉分頁就沒了。
  </div>

  <div class="row two">
    <div>
      <label for="provider">供應商</label>
      <select id="provider">
        <option value="gemini">Gemini（Google）</option>
        <option value="anthropic">Claude（Anthropic）</option>
      </select>
    </div>
    <div>
      <label for="model">模型</label>
      <select id="model"></select>
    </div>
  </div>

  <div class="row two">
    <div>
      <label for="lang">學習語言</label>
      <select id="lang">
        <option value="fr">法文</option>
        <option value="ja">日文（會多要假名讀音）</option>
        <option value="en">英文</option>
        <option value="ko">韓文</option>
        <option value="es">西班牙文</option>
        <option value="de">德文</option>
      </select>
    </div>
    <div>
      <label for="native">母語</label>
      <select id="native"><option value="繁體中文">繁體中文</option></select>
    </div>
  </div>

  <div class="row">
    <label for="key">API key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="貼上你的 key">
    <div class="hint" id="keyhint"></div>
  </div>

  <div class="row">
    <label for="lines">測試用字幕（一行一句，模擬自動字幕：沒有標點）</label>
    <textarea id="lines"></textarea>
  </div>

  <div class="bar">
    <button class="primary" id="run">執行測試</button>
    <span class="hint" id="timing"></span>
  </div>

  <div id="steps"></div>
  <div id="result"></div>
</main>

<script type="module">
import { callModel, analyzeJob } from '../background/providers.js';

const MODELS = {
  gemini: ['gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-4-hydrogen'],
  anthropic: ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5']
};
const HINTS = {
  gemini: 'aistudio.google.com 申請，通常是 AIza... 開頭',
  anthropic: 'console.anthropic.com 申請，sk-ant-... 開頭'
};
const DEMO = `toi ça va un peu fatigué mais ça va tu es fatigué à cause du
travail oui j'étais de garde à l'hôpital tout le weekend donc je n'ai
pas pu me reposer oh ma pauvre oui c'était dur heureusement j'ai eu un
jour de repos mais je n'ai pas complètement récupéré et toi tu as fait
quoi ce weekend je suis allée à Bordeaux pour voir mes parents`;

const $ = (id) => document.getElementById(id);
$('lines').value = DEMO;

function syncProvider() {
  const p = $('provider').value;
  $('model').innerHTML = '';
  for (const m of MODELS[p]) $('model').add(new Option(m, m));
  $('keyhint').textContent = HINTS[p];
}
$('provider').addEventListener('change', syncProvider);
syncProvider();

function step(title, state, body) {
  const d = document.createElement('div');
  d.className = 'step';
  d.innerHTML = '<h3><span class="dot ' + state + '"></span>' + title + '</h3>';
  if (body) { const p = document.createElement('pre'); p.textContent = body; d.appendChild(p); }
  $('steps').appendChild(d);
  return d;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render(data) {
  const r = $('result');
  r.innerHTML = '<h2>解析後的結果（面板會顯示的內容）</h2>';
  const add = (html) => { const d = document.createElement('div'); d.innerHTML = html; r.appendChild(d); };
  if (data.sentences.length) {
    add('<h2 style="font-size:13px;color:var(--dim)">逐句</h2>');
    for (const s of data.sentences) {
      add('<div class="card"><div>' + esc(s.text) + '</div>' +
          (s.reading ? '<div class="zh">' + esc(s.reading) + '</div>' : '') +
          '<div class="zh">' + esc(s.translation || '') +
          '</div><div class="zh" style="font-size:11px">行 ' + s.start_line + '–' + s.end_line + '</div></div>');
    }
  }
  if (data.vocab.length) {
    add('<h2 style="font-size:13px;color:var(--dim)">單字</h2>');
    for (const v of data.vocab) {
      add('<div class="card"><span class="word">' + esc(v.word) + '</span>' +
          (v.reading ? '<span class="pos">' + esc(v.reading) + '</span>' : '') +
          '<span class="pos">' + esc(v.pos || '') +
          '</span>' + (v.lemma && v.lemma !== v.word ? '<span class="pos">← ' + esc(v.lemma) + '</span>' : '') +
          '<div>' + esc(v.meaning || '') + '</div>' +
          (v.note ? '<div class="zh">' + esc(v.note) + '</div>' : '') + '</div>');
    }
  }
  if (data.phrases.length) {
    add('<h2 style="font-size:13px;color:var(--dim)">片語・口語</h2>');
    for (const p of data.phrases) {
      add('<div class="card"><span class="word">' + esc(p.phrase) + '</span>' +
          (p.reading ? '<span class="pos">' + esc(p.reading) + '</span>' : '') +
          '<div>' + esc(p.meaning || '') + '</div>' +
          (p.note ? '<div class="zh">' + esc(p.note) + '</div>' : '') + '</div>');
    }
  }
  if (data.notes.length) {
    add('<h2 style="font-size:13px;color:var(--dim)">重點</h2>');
    add('<div class="card">' + data.notes.map((n) => esc(n)).join('<br>') + '</div>');
  }
}

$('run').addEventListener('click', async () => {
  $('steps').innerHTML = ''; $('result').innerHTML = ''; $('timing').textContent = '';
  const key = $('key').value.trim();
  if (!key) { step('缺少 API key', 'err', '請先在上面貼上 key。'); return; }

  const LANGS = { fr: '法文', en: '英文', ja: '日文', ko: '韓文', es: '西班牙文', de: '德文' };
  const settings = {
    provider: $('provider').value,
    model: $('model').value,
    apiKey: key,
    nativeLang: $('native').value,
    targetLang: $('lang').value,
    langName: LANGS[$('lang').value] || $('lang').value
  };
  const lines = $('lines').value.split('\n').map((t) => t.trim()).filter(Boolean).map((text, i) => ({ i, text }));

  step('送出請求', 'ok',
    '供應商：' + settings.provider + '\n模型：' + settings.model +
    '\n字幕行數：' + lines.length + '\n（key 只放在標頭，不會出現在任何輸出裡）');

  const running = step('等待回應…', 'run');
  $('run').disabled = true;
  const t0 = performance.now();
  try {
    const data = await callModel(settings, analyzeJob(settings, lines), (p) => {
      const h3 = running.querySelector('h3');
      if (p.phase === 'request') {
        h3.lastChild.textContent = p.attempt === 1 ? '等待回應…' : `第 ${p.attempt}/${p.max} 次嘗試…`;
      } else {
        h3.lastChild.textContent = `第 ${p.attempt} 次失敗，${Math.round(p.waitMs / 1000)} 秒後重試…`;
        let pre = running.querySelector('pre');
        if (!pre) { pre = document.createElement('pre'); running.appendChild(pre); }
        pre.textContent = p.reason;
      }
    });
    const ms = Math.round(performance.now() - t0);
    running.querySelector('.dot').className = 'dot ok';
    running.querySelector('h3').lastChild.textContent = '收到回應並解析成功';
    $('timing').textContent = ms + ' ms';
    step('結構檢查', 'ok',
      'sentences: ' + data.sentences.length + ' 句\n' +
      'vocab: ' + data.vocab.length + ' 個\n' +
      'phrases: ' + data.phrases.length + ' 個\n' +
      'notes: ' + data.notes.length + ' 則\n' +
      '行號範圍合法: ' + data.sentences.every((s) =>
        Number.isInteger(s.start_line) && s.start_line >= 0 && s.end_line < lines.length));
    step('原始 JSON', 'ok', JSON.stringify(data, null, 2));
    render(data);
  } catch (e) {
    const ms = Math.round(performance.now() - t0);
    running.querySelector('.dot').className = 'dot err';
    running.querySelector('h3').lastChild.textContent = '失敗';
    $('timing').textContent = ms + ' ms';
    step('錯誤訊息（把這段貼給 Claude Code）', 'err', String((e && e.message) || e));
  } finally {
    $('run').disabled = false;
  }
});
</script>
</body>
</html>
